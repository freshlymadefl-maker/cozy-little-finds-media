<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=DM+Sans:wght@500;600&display=swap">
<style>
  html, body { margin:0; width:1080px; height:1350px; }

  .link { position:absolute; left:64px; top:1010px; display:flex; align-items:center; gap:14px; background:#fff; border-radius:22px; padding:16px 30px 16px 22px; font:500 46px "DM Sans", sans-serif; color:#111; box-shadow:0 6px 18px rgba(0,0,0,.25); }

  .ad { position:absolute; right:28px; bottom:28px; background:#F4EBDD; color:#2F4A3A; font:700 24px "Courier Prime", monospace; letter-spacing:.06em; padding:6px 12px; border-radius:6px; }

<body>

  <div class="link"><svg viewBox="0 0 24 24" fill="none" stroke="#3B82F6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>All on amazon</div>
